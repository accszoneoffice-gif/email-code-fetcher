<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Code Fetcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7fe; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-primary { background-color: #2563eb; border: none; padding: 12px; font-weight: 600; border-radius: 8px; }
        .btn-primary:hover { background-color: #1d4ed8; }
        
        /* কাস্টম টোস্ট পপআপ স্টাইল */
        #custom-toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #10b981;
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 14px 24px;
            position: fixed;
            z-index: 9999;
            top: 20px;
            right: 20px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            opacity: 0;
            transition: opacity 0.4s ease-in-out, top 0.4s ease-in-out;
        }

        #custom-toast.show {
            visibility: visible;
            opacity: 1;
            top: 30px;
        }
    </style>
</head>
<body>

    <!-- গ্রিন পপআপ নোটিফিকেশন -->
    <div id="custom-toast">✓ Copied to clipboard!</div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card p-4">
                    <h4 class="mb-3 text-primary fw-bold"> Get Verification Code</h4>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted fw-semibold">ACCOUNT DETAILS</label>
                        <textarea id="accountData" class="form-rows-4 form-control" rows="5" placeholder="email|password|refresh_token|client_id"></textarea>
                    </div>

                    <div id="emailBox" class="p-3 bg-light rounded mb-3 d-flex justify-content-between align-items-center d-none">
                        <span id="extractedEmail" class="fw-bold text-dark"></span>
                        <button class="btn btn-sm btn-outline-primary" onclick="copyText('extractedEmail', 'Email copied!')">Copy Email</button>
                    </div>

                    <button class="btn btn-primary w-100 mb-3" onclick="getCode()">Get Verification Code</button>

                    <div id="resultBox" class="p-3 bg-success-subtle text-success border border-success rounded d-none">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="fw-bold d-block">VERIFICATION CODE</small>
                                <span id="codeValue" class="fs-2 fw-bold"></span>
                            </div>
                            <button class="btn btn-success" onclick="copyText('codeValue', 'Code copied!')">Copy Code</button>
                        </div>
                    </div>

                    <div id="errorBox" class="p-3 bg-danger-subtle text-danger border border-danger rounded d-none"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // কাস্টম গ্রিন পপআপ ফাংশন (৩ সেকেন্ড পর অদৃশ্য হয়ে যাবে)
        function showToast(message) {
            const toast = document.getElementById("custom-toast");
            toast.innerText = "✓ " + message;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        // অডিও অবজেক্ট (সফলভাবে কোড আসলে সাউন্ড বাজবে)
        function playSuccessSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 tone
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5 tone
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function copyText(elementId, successMsg) {
            const text = document.getElementById(elementId).innerText;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast(successMsg);
            });
        }

        // অটো ইমেইল এক্সট্রাক্ট
        document.getElementById('accountData').addEventListener('input', function(e) {
            const val = e.target.value.trim();
            const emailBox = document.getElementById('emailBox');
            if (val.includes('|')) {
                const email = val.split('|')[0].trim();
                document.getElementById('extractedEmail').innerText = email;
                emailBox.classList.remove('d-none');
            } else {
                emailBox.classList.add('d-none');
            }
        });

        async function getCode() {
            const accountData = document.getElementById('accountData').value;
            const resultBox = document.getElementById('resultBox');
            const errorBox = document.getElementById('errorBox');
            
            resultBox.classList.add('d-none');
            errorBox.classList.add('d-none');

            try {
                const res = await fetch('/api/get-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accountData })
                });
                const data = await res.json();

                if (data.success && data.code) {
                    document.getElementById('codeValue').innerText = data.code;
                    resultBox.classList.remove('d-none');
                    playSuccessSound(); // সাউন্ড প্লে হবে
                    showToast("Verification code retrieved!");
                } else {
                    errorBox.innerText = data.error || "Failed to fetch code.";
                    errorBox.classList.remove('d-none');
                }
            } catch (err) {
                errorBox.innerText = "Error connecting to server.";
                errorBox.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
