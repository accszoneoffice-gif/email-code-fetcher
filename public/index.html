<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Code & Link Fetcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7fe; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-primary { background-color: #2563eb; border: none; padding: 12px; font-weight: 600; border-radius: 8px; }
        .btn-primary:hover { background-color: #1d4ed8; }
        
        #custom-toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #10b981;
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 14px 24px;
            position: fixed;
            z-index: 9999;
            top: 20px;
            right: 20px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            opacity: 0;
            transition: opacity 0.4s ease-in-out, top 0.4s ease-in-out;
        }

        #custom-toast.show {
            visibility: visible;
            opacity: 1;
            top: 30px;
        }
    </style>
</head>
<body>

    <div id="custom-toast">✓ Copied to clipboard!</div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card p-4">
                    <h4 class="mb-3 text-primary fw-bold"> Get Verification Code & Link</h4>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted fw-semibold">ACCOUNT DETAILS</label>
                        <textarea id="accountData" class="form-control" rows="4" placeholder="email|password|refresh_token|client_id"></textarea>
                    </div>

                    <div id="emailBox" class="p-3 bg-light rounded mb-3 d-flex justify-content-between align-items-center d-none">
                        <span id="extractedEmail" class="fw-bold text-dark"></span>
                        <button class="btn btn-sm btn-outline-primary" onclick="copyText('extractedEmail', 'Email copied!')">Copy Email</button>
                    </div>

                    <button class="btn btn-primary w-100 mb-3" onclick="getCode()">Get Verification Code / Link</button>

                    <!-- Code Display Box -->
                    <div id="resultBox" class="p-3 bg-success-subtle text-success border border-success rounded mb-3 d-none">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="fw-bold d-block">VERIFICATION CODE</small>
                                <span id="codeValue" class="fs-2 fw-bold"></span>
                            </div>
                            <button class="btn btn-success" onclick="copyText('codeValue', 'Code copied!')">Copy Code</button>
                        </div>
                    </div>

                    <!-- Link Display Box -->
                    <div id="linkBox" class="p-3 bg-info-subtle text-info-emphasis border border-info rounded mb-3 d-none">
                        <div class="d-flex justify-content-between align-items-center">
                            <div style="max-width: 75%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                <small class="fw-bold d-block text-uppercase">Verification Link</small>
                                <a id="linkValue" href="#" target="_blank" class="fw-semibold text-primary text-decoration-underline"></a>
                            </div>
                            <button class="btn btn-info btn-sm text-white fw-bold" onclick="copyText('linkValue', 'Link copied!')">Copy Link</button>
                        </div>
                    </div>

                    <div id="errorBox" class="p-3 bg-danger-subtle text-danger border border-danger rounded d-none"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showToast(message) {
            const toast = document.getElementById("custom-toast");
            toast.innerText = "✓ " + message;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        function playSuccessSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = "triangle";
            osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            gain1.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(audioCtx.currentTime);
            osc1.stop(audioCtx.currentTime + 0.15);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = "triangle";
            osc2.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.12);
            gain2.gain.setValueAtTime(0.6, audioCtx.currentTime + 0.12);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(audioCtx.currentTime + 0.12);
            osc2.stop(audioCtx.currentTime + 0.4);
        }

        function copyText(elementId, successMsg) {
            const element = document.getElementById(elementId);
            const text = element.innerText || element.href;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast(successMsg);
            });
        }

        document.getElementById('accountData').addEventListener('input', function(e) {
            const val = e.target.value.trim();
            const emailBox = document.getElementById('emailBox');
            if (val.includes('|')) {
                const email = val.split('|')[0].trim();
                document.getElementById('extractedEmail').innerText = email;
                emailBox.classList.remove('d-none');
            } else {
                emailBox.classList.add('d-none');
            }
        });

        async function getCode() {
            const accountData = document.getElementById('accountData').value;
            const resultBox = document.getElementById('resultBox');
            const linkBox = document.getElementById('linkBox');
            const errorBox = document.getElementById('errorBox');
            
            resultBox.classList.add('d-none');
            linkBox.classList.add('d-none');
            errorBox.classList.add('d-none');

            try {
                const res = await fetch('/api/get-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accountData })
                });
                const data = await res.json();

                if (data.success) {
                    let found = false;

                    if (data.code) {
                        document.getElementById('codeValue').innerText = data.code;
                        resultBox.classList.remove('d-none');
                        found = true;
                    }

                    if (data.link) {
                        const linkElem = document.getElementById('linkValue');
                        linkElem.innerText = data.link;
                        linkElem.href = data.link;
                        linkBox.classList.remove('d-none');
                        found = true;
                    }

                    if (found) {
                        playSuccessSound();
                        showToast("Retrieved successfully!");
                    } else {
                        errorBox.innerText = "No code or link found in recent emails.";
                        errorBox.classList.remove('d-none');
                    }
                } else {
                    errorBox.innerText = data.error || "Failed to fetch code.";
                    errorBox.classList.remove('d-none');
                }
            } catch (err) {
                errorBox.innerText = "Error connecting to server.";
                errorBox.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
